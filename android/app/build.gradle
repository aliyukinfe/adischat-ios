import groovy.json.JsonSlurper

plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'com.google.gms.google-services'
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("local.properties")
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

def qaProperties = new Properties()
def qaPropertiesFile = rootProject.file("qa.local.properties")
if (qaPropertiesFile.exists()) {
    qaProperties.load(new FileInputStream(qaPropertiesFile))
}
def qaValue = { name -> (qaProperties[name] ?: "").toString().trim() }
def qaBool = { name -> qaValue(name).equalsIgnoreCase("true") }
def qaBuildRequested = gradle.startParameter.taskNames.any { task ->
    task.toLowerCase().matches(".*(?:assemble|bundle|install|compile|generate|process|prebuild|validate)qa.*")
}
def restaurantsStagingBuildRequested = gradle.startParameter.taskNames.any { task ->
    task.toLowerCase().matches(".*(?:assemble|bundle|install|compile|generate|process|prebuild|validate)restaurantsstaging.*")
}
def validateQaFirebaseJson = { String relativePath ->
    def qaJsonFile = file(relativePath)
    if (!qaJsonFile.isFile()) throw new GradleException("QA Firebase config is missing from app/$relativePath")
    def qaJson = new JsonSlurper().parse(qaJsonFile)
    if (qaJson.project_info?.project_id != "adischat-qa" ||
        !qaJson.client?.any { it.client_info?.android_client_info?.package_name == "com.adischat.app.qa" }) {
        throw new GradleException("QA Firebase project/package mismatch in app/$relativePath")
    }
}
def requireAllowedQaHosts = {
    def allowedHosts = qaValue("QA_ALLOWED_HOSTS").split(",").collect { it.trim() }.findAll { it }.toSet()
    if (allowedHosts.isEmpty()) throw new GradleException("QA_ALLOWED_HOSTS must list exact isolated hosts")
    return allowedHosts
}
def validateIsolatedQaUrl = { String name, Set<String> allowedHosts, String requiredHost = null ->
    def value = qaValue(name)
    def uri = value ? new URI(value) : null
    if (!uri || uri.scheme != "https" || !uri.host || !allowedHosts.contains(uri.host) ||
        uri.userInfo || uri.query || uri.fragment ||
        uri.host.endsWith(".invalid") || uri.host.endsWith(".example") ||
        uri.host in ["mcewjfnkrtiiolzibsuh.supabase.co",
                     "adischat-api.adischat.workers.dev", "adischat-wallet-api.adischat.workers.dev"] ||
        uri.host.contains("adischat-f4a77") ||
        (requiredHost != null && uri.host != requiredHost)) {
        throw new GradleException("$name must be an isolated HTTPS QA endpoint and not point to production")
    }
}
def validateRestaurantsQaEndpoints = { Set<String> allowedHosts ->
    def restaurantsSupabaseUrl = qaValue("QA_RESTAURANTS_SUPABASE_URL")
    def restaurantsAnonKey = qaValue("QA_RESTAURANTS_SUPABASE_ANON_KEY") ?: qaValue("QA_RESTAURANTS_SUPABASE_PUBLISHABLE_KEY")
    def restaurantsWorkerUrl = qaValue("QA_RESTAURANTS_WORKER_BASE_URL") ?: qaValue("QA_RESTAURANTS_IDENTITY_BRIDGE_URL")
    def restaurantsSupabaseUri = restaurantsSupabaseUrl ? new URI(restaurantsSupabaseUrl) : null
    def restaurantsWorkerUri = restaurantsWorkerUrl ? new URI(restaurantsWorkerUrl) : null
    if (!restaurantsSupabaseUri || restaurantsSupabaseUri.scheme != "https" ||
        restaurantsSupabaseUri.host != "gnhemfikofnzpemgnqdv.supabase.co" ||
        restaurantsSupabaseUri.userInfo || restaurantsSupabaseUri.query || restaurantsSupabaseUri.fragment ||
        (restaurantsSupabaseUri.path && restaurantsSupabaseUri.path != "/") ||
        !allowedHosts.contains(restaurantsSupabaseUri.host)) {
        throw new GradleException("QA_RESTAURANTS_SUPABASE_URL must be the exact staging host gnhemfikofnzpemgnqdv.supabase.co and listed in QA_ALLOWED_HOSTS")
    }
    if (!restaurantsWorkerUri || restaurantsWorkerUri.scheme != "https" ||
        restaurantsWorkerUri.host != "adischat-api-staging.adischat.workers.dev" ||
        restaurantsWorkerUri.userInfo || restaurantsWorkerUri.query || restaurantsWorkerUri.fragment ||
        (restaurantsWorkerUri.path && restaurantsWorkerUri.path != "/") ||
        !allowedHosts.contains(restaurantsWorkerUri.host)) {
        throw new GradleException("QA_RESTAURANTS_WORKER_BASE_URL must be the exact staging host adischat-api-staging.adischat.workers.dev and listed in QA_ALLOWED_HOSTS")
    }
    if (!restaurantsAnonKey || restaurantsAnonKey.toLowerCase().contains("paste") ||
        restaurantsAnonKey.toLowerCase().contains("service_role")) {
        throw new GradleException("QA_RESTAURANTS_SUPABASE_ANON_KEY must be a non-empty staging anon/publishable key")
    }
    if (!qaBool("QA_RESTAURANTS_IDENTITY_BRIDGE_ENABLED")) {
        throw new GradleException("QA_RESTAURANTS_IDENTITY_BRIDGE_ENABLED must be explicitly set to true in qa.local.properties for QA builds")
    }
    if (!qaBool("QA_RESTAURANTS_ORDER_MUTATIONS_ENABLED")) {
        throw new GradleException("QA_RESTAURANTS_ORDER_MUTATIONS_ENABLED must be explicitly set to true in qa.local.properties for QA builds")
    }
}
def validateQaIsolation = {
    validateQaFirebaseJson("src/qa/google-services.json")
    def allowedHosts = requireAllowedQaHosts()
    ["QA_ADISCHAT_API_URL", "QA_WALLET_API_URL", "QA_SHOP_SUPABASE_URL",
     "QA_IDENTITY_BRIDGE_URL", "QA_MEDIA_BASE_URL"].each { name ->
        validateIsolatedQaUrl(name, allowedHosts, null)
    }
    def qaShopRef = qaValue("QA_SHOP_PROJECT_REF")
    if (!qaShopRef.matches("[a-z]{20}") ||
        qaShopRef == "mcewjfnkrtiiolzibsuh" ||
        qaShopRef != "opkqyvttbyezjbqwkvho" ||
        new URI(qaValue("QA_SHOP_SUPABASE_URL")).host != "${qaShopRef}.supabase.co") {
        throw new GradleException("QA Shop URL must match AdisGebeya Staging ref opkqyvttbyezjbqwkvho and cannot point to production")
    }
    if (!qaValue("QA_SHOP_SUPABASE_PUBLISHABLE_KEY") ||
        qaValue("QA_SHOP_SUPABASE_PUBLISHABLE_KEY").toLowerCase().contains("paste") ||
        qaValue("QA_SHOP_ASSERTION_ISSUER") == "" || qaValue("QA_SHOP_ASSERTION_AUDIENCE") == "") {
        throw new GradleException("QA Shop key and identity configuration must be separate and complete")
    }
    validateRestaurantsQaEndpoints(allowedHosts)
}
def validateRestaurantsStagingIsolation = {
    if (!qaPropertiesFile.isFile()) {
        throw new GradleException("android/qa.local.properties is required for restaurantsStaging builds")
    }
    validateQaFirebaseJson("src/restaurantsStaging/google-services.json")
    def allowedHosts = requireAllowedQaHosts()
    ["QA_ADISCHAT_API_URL", "QA_MEDIA_BASE_URL"].each { name ->
        validateIsolatedQaUrl(name, allowedHosts, "adischat-api-staging.adischat.workers.dev")
    }
    validateRestaurantsQaEndpoints(allowedHosts)
}
def validateReleaseIsolation = {
    def prodJsonFile = file("google-services.json")
    if (!prodJsonFile.isFile()) throw new GradleException("Production Firebase config is missing from app/google-services.json")
    def prodJson = new JsonSlurper().parse(prodJsonFile)
    if (prodJson.project_info?.project_id != "adischat-f4a77" ||
        !prodJson.client?.any { it.client_info?.android_client_info?.package_name == "com.adischat.app" }) {
        throw new GradleException("Release Firebase project/package mismatch: must be adischat-f4a77 / com.adischat.app")
    }
    def prodShopUrl = keystoreProperties['ADISHOP_SUPABASE_URL'] ?: System.getenv('ADISHOP_SUPABASE_URL') ?: "https://mcewjfnkrtiiolzibsuh.supabase.co"
    if (prodShopUrl.contains("opkqyvttbyezjbqwkvho") || prodShopUrl.contains("gnhemfikofnzpemgnqdv")) {
        throw new GradleException("Release build cannot use staging Supabase URL: $prodShopUrl")
    }
}
tasks.register("validateQaIsolation") { doLast { validateQaIsolation() } }
tasks.matching { it.name == "preQaBuild" }.configureEach { dependsOn("validateQaIsolation") }
tasks.register("validateRestaurantsStagingIsolation") { doLast { validateRestaurantsStagingIsolation() } }
tasks.matching { it.name == "preRestaurantsStagingBuild" }.configureEach { dependsOn("validateRestaurantsStagingIsolation") }
tasks.register("validateReleaseIsolation") { doLast { validateReleaseIsolation() } }
tasks.matching { it.name == "preReleaseBuild" }.configureEach { dependsOn("validateReleaseIsolation") }

