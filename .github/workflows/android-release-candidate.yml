name: Build AdisChat Android Release Candidate

on:
  push:
    branches:
      - 'release/**'
  workflow_dispatch:
    inputs:
      clean_build:
        description: 'Run clean before build'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  build-release-candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Prepare production environment and release signing
        env:
          ADISHOP_PUB_KEY: ${{ secrets.ADISHOP_SUPABASE_PUBLISHABLE_KEY }}
          KEYSTORE_B64: ${{ secrets.ADISCHAT_UPLOAD_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.ADISCHAT_UPLOAD_KEY_ALIAS }}
          STORE_PWD: ${{ secrets.ADISCHAT_UPLOAD_STORE_PASSWORD }}
          KEY_PWD: ${{ secrets.ADISCHAT_UPLOAD_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -f android/app/google-services.json || { echo 'Production google-services.json is missing'; exit 1; }
          PUB_KEY="${ADISHOP_PUB_KEY:-sb_publishable_GqKe_CHk8GQ0oO3SQNbHHQ_0L71yj8x}"
          printf '\nADISHOP_SUPABASE_PUBLISHABLE_KEY=%s\n' "$PUB_KEY" >> android/local.properties

          echo "=== Configuring Production Release Signing ==="
          mkdir -p android/app/keystore
          KEYSTORE_PATH="android/app/keystore/adischat-upload.jks"

          if [ -n "${KEYSTORE_B64:-}" ]; then
            echo "Decoding release upload keystore..."
            printf '%s' "$KEYSTORE_B64" | base64 -d > "$KEYSTORE_PATH"
          else
            echo "ERROR: ADISCHAT_UPLOAD_KEYSTORE_BASE64 secret is not configured!"
            exit 1
          fi

          ALIAS="${KEY_ALIAS:-upload}"
          printf '\nADISCHAT_UPLOAD_STORE_FILE=keystore/adischat-upload.jks\nADISCHAT_UPLOAD_KEY_ALIAS=%s\nADISCHAT_UPLOAD_STORE_PASSWORD=%s\nADISCHAT_UPLOAD_KEY_PASSWORD=%s\n' "$ALIAS" "$STORE_PWD" "$KEY_PWD" >> android/local.properties

          echo "=== Keystore Preflight Certificate Check ==="
          keytool -list -v -keystore "$KEYSTORE_PATH" -alias "$ALIAS" -storepass "$STORE_PWD" | grep -E "Owner:|SHA1:|SHA256:"

          if [ ! -d "$ANDROID_HOME/platforms/android-36" ]; then
            echo y | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" || true
          fi
          test -d "$ANDROID_HOME/platforms/android-36" || { echo 'Android SDK 36 is unavailable'; exit 1; }

      - name: Build Release Candidate AAB and APK
        working-directory: android
        env:
          ADISCHAT_UPLOAD_STORE_FILE: keystore/adischat-upload.jks
          ADISCHAT_UPLOAD_KEY_ALIAS: ${{ secrets.ADISCHAT_UPLOAD_KEY_ALIAS }}
          ADISCHAT_UPLOAD_STORE_PASSWORD: ${{ secrets.ADISCHAT_UPLOAD_STORE_PASSWORD }}
          ADISCHAT_UPLOAD_KEY_PASSWORD: ${{ secrets.ADISCHAT_UPLOAD_KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          if [ "${{ inputs.clean_build }}" = "true" ]; then
            ./gradlew clean :app:bundleRelease :app:assembleRelease --no-daemon --max-workers=2 --console=plain "-Dorg.gradle.java.home=$JAVA_HOME"
          else
            ./gradlew :app:bundleRelease :app:assembleRelease --no-daemon --max-workers=2 --console=plain "-Dorg.gradle.java.home=$JAVA_HOME"
          fi

      - name: Verify Release Candidate Signature
        run: |
          set -euo pipefail
          echo "=== Verifying AAB Cryptographic Signature ==="
          AAB_FILE=$(ls android/app/build/outputs/bundle/release/*.aab | head -n 1)
          test -f "$AAB_FILE" || { echo "AAB file not found"; exit 1; }
          
          # 1. Verify JAR signature
          jarsigner -verify "$AAB_FILE" | grep -q "jar verified" || {
            echo "ERROR: AAB is unsigned or failed jar signature verification!"
            exit 1
          }
          echo "AAB jar signature: VERIFIED"

          # 2. Verify certificate fingerprint matches Google Play upload key
          echo "=== Extracting AAB Certificate Fingerprint ==="
          CERT_INFO=$(keytool -printcert -jarfile "$AAB_FILE")
          echo "$CERT_INFO" | grep -E "Owner:|Issuer:|Serial number:|SHA1:|SHA256:"

          ACTUAL_SHA256=$(echo "$CERT_INFO" | grep "SHA256:" | head -n 1 | tr -d ' \t' | cut -d: -f2-)
          EXPECTED_SHA256="81:0A:9F:57:3D:65:60:DB:05:30:26:63:29:A9:1B:0F:D2:CB:B7:3E:2E:0C:D2:3A:9F:81:3B:CB:03:8A:B1:08"

          echo "Found SHA-256:    $ACTUAL_SHA256"
          echo "Expected SHA-256: $EXPECTED_SHA256"

          if [ "$ACTUAL_SHA256" != "$EXPECTED_SHA256" ]; then
            echo "ERROR: AAB signature fingerprint does NOT match Google Play upload key!"
            exit 1
          fi

          echo "=== AAB SIGNING VERIFICATION PASSED: 100% MATCH WITH GOOGLE PLAY UPLOAD KEY ==="

      - name: Upload Release Candidate AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: adischat-release-candidate-aab
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 7

      - name: Upload Release Candidate APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: adischat-release-candidate-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 7
