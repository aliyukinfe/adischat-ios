name: Build iOS App

on:
  push:
    branches: [main]
  workflow_dispatch:   # allows manual trigger from GitHub UI

jobs:
  build-ios:
    runs-on: macos-latest   # GitHub's free cloud Mac

    steps:
      # ── 1. Checkout code ──────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── 2. Setup Node ─────────────────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # ── 3. Install dependencies ───────────────────────────
      - name: Install npm dependencies
        run: npm ci

      # ── 4. Sync Capacitor iOS ─────────────────────────────
      - name: Capacitor sync iOS
        run: npx cap sync ios

      # ── 5. Setup Xcode ────────────────────────────────────
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      # ── 6. Install CocoaPods ──────────────────────────────
      - name: Install CocoaPods
        run: |
          cd ios/App
          pod install --repo-update

      # ── 7. Build (unsigned) ───────────────────────────────
      #   Produces a .app bundle — good for simulator testing
      #   To build a signed IPA for App Store, add signing secrets below
      - name: Build iOS (unsigned)
        run: |
          xcodebuild \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Release \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath build/ios \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty || true

      # ── 8. Upload build artifact ──────────────────────────
      - name: Upload .app artifact
        uses: actions/upload-artifact@v4
        with:
          name: AdisChat-iOS
          path: build/ios/Build/Products/Release-iphonesimulator/App.app
          retention-days: 14
