workflows:
  ios-simulator:
    name: AdisChat iOS - Appetize simulator build
    max_build_duration: 30
    instance_type: mac_mini_m2

    environment:
      node: 22
      xcode: latest

    triggering:
      events:
        - push
        - pull_request
      branch_patterns:
        - pattern: "*"
          include: true

    scripts:
      - name: Install dependencies
        script: |
          npm ci
          echo "Node: $(node -v)"
          echo "NPM: $(npm -v)"
          npx cap --version

      - name: Sync Capacitor iOS project
        script: |
          python3 scripts/patch_capacitor_spm_versions.py
          npx cap sync ios
          python3 scripts/normalize_capacitor_spm_paths.py

      - name: Build simulator app
        script: |
          # Build for BOTH arm64 + x86_64 so it opens on Appetize.io
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath build/ios \
            ONLY_ACTIVE_ARCH=NO \
            ARCHS="arm64 x86_64" \
            VALID_ARCHS="arm64 x86_64" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Zip for Appetize
        script: |
          APP_PATH=$(find build/ios/Build/Products/Debug-iphonesimulator -maxdepth 1 -name "*.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "No simulator .app found"
            exit 1
          fi
          mkdir -p "$CM_EXPORT_DIR"
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "$CM_EXPORT_DIR/AdisChat-simulator.zip"
          ls -lh "$CM_EXPORT_DIR"

    artifacts:
      - $CM_EXPORT_DIR/AdisChat-simulator.zip
      - /tmp/xcodebuild_logs/*.log

  ios-release:
    name: AdisChat iOS - App Store IPA
    max_build_duration: 60
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: AdisChat AppStore

    environment:
      node: 22
      xcode: latest
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.adischat.app
      vars:
        APP_ID: com.adischat.app
        APP_NAME: AdisChat

    scripts:
      - name: Install dependencies
        script: |
          npm ci
          npx cap --version

      - name: Sync Capacitor iOS project
        script: |
          python3 scripts/patch_capacitor_spm_versions.py
          npx cap sync ios
          python3 scripts/normalize_capacitor_spm_paths.py

      - name: Set up code signing
        script: xcode-project use-profiles

      - name: Set build number
        script: |
          cd ios/App
          agvtool new-version -all "$CM_BUILD_NUMBER"

      - name: Build signed IPA
        script: |
          xcode-project build-ipa \
            --project "ios/App/App.xcodeproj" \
            --scheme "App"

    artifacts:
      - build/ios/ipa/*.ipa
      - $CM_EXPORT_DIR/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        beta_groups:
          - Internal Testers
