<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#050A07">
  <title>Download AdisChat Desktop</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #050A07;
      --card: rgba(255, 255, 255, 0.075);
      --line: rgba(255, 255, 255, 0.12);
      --text: #F7FFF9;
      --muted: #A8B4AD;
      --green: #22C55E;
      --green-soft: rgba(34, 197, 94, 0.16);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at 18% 10%, rgba(34, 197, 94, 0.22), transparent 34%),
        radial-gradient(circle at 84% 22%, rgba(124, 255, 138, 0.10), transparent 32%),
        linear-gradient(145deg, #050A07, #0B1710 48%, #050A07);
      color: var(--text);
    }
    main {
      width: min(760px, 100%);
      padding: clamp(24px, 5vw, 42px);
      border: 1px solid var(--line);
      border-radius: 32px;
      background: var(--card);
      box-shadow: 0 28px 90px rgba(0, 0, 0, 0.42);
      backdrop-filter: blur(20px);
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 30px;
    }
    .mark {
      width: 54px;
      height: 54px;
      border-radius: 18px;
      display: grid;
      place-items: center;
      background: var(--green-soft);
      border: 1px solid rgba(34, 197, 94, 0.36);
      color: var(--green);
      font-weight: 950;
      font-size: 24px;
    }
    h1 {
      margin: 0;
      max-width: 620px;
      font-size: clamp(32px, 5vw, 54px);
      line-height: 1.02;
      letter-spacing: 0;
    }
    p {
      margin: 14px 0 0;
      max-width: 620px;
      color: var(--muted);
      font-size: 17px;
      line-height: 1.55;
    }
    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 28px;
    }
    a.button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 58px;
      padding: 0 24px;
      border-radius: 18px;
      text-decoration: none;
      color: #041007;
      background: var(--green);
      font-weight: 950;
      box-shadow: 0 12px 34px rgba(34, 197, 94, 0.28);
    }
    a.secondary {
      color: var(--text);
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--line);
      box-shadow: none;
    }
    .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 24px;
      color: var(--muted);
      font-size: 13px;
    }
    .meta span {
      padding: 8px 10px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.055);
    }
  </style>
</head>
<body>
  <main>
    <div class="brand">
      <div class="mark">A</div>
      <strong>AdisChat</strong>
    </div>
    <h1>Download AdisChat Desktop for Windows</h1>
    <p>Install the latest AdisChat Desktop client for private chats, groups, channels, calls, QR login, and media sharing.</p>
    <div class="actions">
      <a class="button" href="/download/windows">Download for Windows</a>
      <a class="button secondary" href="/downloads/adischat-desktop-windows-1.2.3.exe">Version 1.2.3</a>
    </div>
    <div class="meta">
      <span>Windows x64</span>
      <span>Version 1.2.3</span>
      <span>Updated June 14, 2026</span>
    </div>
  </main>
</body>
</html>
